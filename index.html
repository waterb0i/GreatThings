<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Be My Valentine?</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #ff9a9e, #fad0c4);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      overflow: hidden;
    }

    .card {
      background: white;
      padding: 3rem 2.5rem;
      border-radius: 24px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.2);
      text-align: center;
      max-width: 420px;
      animation: popIn 0.8s ease;
    }

    h1 {
      font-size: 2.5rem;
      margin-bottom: 1rem;
      color: #e63946;
    }

    p {
      font-size: 1.2rem;
      margin-bottom: 2rem;
      color: #444;
    }

    .buttons {
      display: flex;
      justify-content: center;
      gap: 1.2rem;
    }

    button {
      border: none;
      padding: 0.9rem 1.6rem;
      font-size: 1.1rem;
      border-radius: 999px;
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    button:hover {
      transform: translateY(-3px);
      box-shadow: 0 10px 20px rgba(0,0,0,0.2);
    }

    .yes {
      background: #e63946;
      color: white;
    }

    .no {
      background: #f1f1f1;
      color: #555;
      position: relative;
    }

    .message {
      display: none;
      font-size: 1.5rem;
      color: #e63946;
      margin-top: 1.5rem;
    }

    @keyframes popIn {
      from { transform: scale(0.8); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    .heart {
      position: absolute;
      font-size: 1.5rem;
      animation: floatUp 4s linear forwards;
      pointer-events: none;
    }

    @keyframes floatUp {
      from { transform: translateY(0); opacity: 1; }
      to { transform: translateY(-100vh); opacity: 0; }
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>❤️ Christine Will You Be My Valentine? ❤️</h1>
    <p>I was wondering if you'd make this Valentine's Day extra special with me.</p>
    <div class="buttons">
      <button class="yes" onclick="sayYes()">Yes 💕</button>
      <button class="no" onmouseover="moveNo()">No 🙃</button>
    </div>
    <div class="message" id="message">Yay!! I can't wait </div>
  </div>

  <script>
    function sayYes() {
      document.getElementById('message').style.display = 'block';
      for (let i = 0; i < 20; i++) {
        createHeart();
      }
    }

    function moveNo() {
      const btn = document.querySelector('.no');
      const x = Math.random() * 200 - 100;
      const y = Math.random() * 200 - 100;
      btn.style.transform = `translate(${x}px, ${y}px)`;
    }

    function createHeart() {
      const heart = document.createElement('div');
      heart.classList.add('heart');
      heart.innerText = '❤️';
      heart.style.left = Math.random() * window.innerWidth + 'px';
      heart.style.bottom = '0px';
      document.body.appendChild(heart);
      setTimeout(() => heart.remove(), 4000);
    }
  </script>
</body>
</html>
