<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Be My Valentine?</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #ff9a9e, #fad0c4);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      overflow: hidden;
      padding: 1rem;
    }

    .card {
      background: white;
      padding: 2.2rem 1.8rem;
      border-radius: 24px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.2);
      text-align: center;
      max-width: 420px;
      width: 100%;
      animation: popIn 0.6s ease;
    }

    h1 {
      font-size: clamp(1.8rem, 5vw, 2.4rem);
      margin-bottom: 1rem;
      color: #e63946;
    }

    p {
      font-size: clamp(1rem, 3.5vw, 1.15rem);
      margin-bottom: 1.8rem;
      color: #444;
    }

    .buttons {
      display: flex;
      justify-content: center;
      gap: 1rem;
      flex-wrap: wrap;
      position: relative;
    }

    button {
      border: none;
      padding: 0.9rem 1.6rem;
      font-size: 1.05rem;
      border-radius: 999px;
      cursor: pointer;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
      min-width: 120px;
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 18px rgba(0,0,0,0.2);
    }

    .yes {
      background: #e63946;
      color: white;
    }

    .no {
      background: #f1f1f1;
      color: #555;
      position: relative;
    }

    .message {
      display: none;
      font-size: clamp(1.2rem, 4vw, 1.5rem);
      color: #e63946;
      margin-top: 1.4rem;
    }

    @keyframes popIn {
      from { transform: scale(0.9); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>❤️ Christine, Will You Be My Valentine? ❤️</h1>
    <p>It would be really special🫠.</p>

    <div class="buttons">
      <button class="yes" onclick="sayYes()">Yaur 💕</button>
      <button class="no" onmouseover="moveNo()">Naur ✋</button>
    </div>

    <div class="message" id="message">Yaya! I can't wait 🥰</div>
  </div>

  <script>
    function sayYes() {
      document.getElementById('message').style.display = 'block';
    }

    function moveNo() {
      const btn = document.querySelector('.no');
      const maxX = 160;
      const maxY = 120;
      const x = Math.random() * maxX - maxX / 2;
      const y = Math.random() * maxY - maxY / 2;
      btn.style.transform = `translate(${x}px, ${y}px)`;
    }
  </script>
</body>
</html>
